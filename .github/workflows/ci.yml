name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: drrosa_test
          POSTGRES_USER: drrosa_test
          POSTGRES_PASSWORD: drrosa_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drrosa_test -d drrosa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_CLIENT: postgres
      DATABASE_URL: postgresql://drrosa_test:drrosa_test_password@127.0.0.1:5432/drrosa_test
      PLAYWRIGHT_TEST_DATABASE_URL: postgresql://drrosa_test:drrosa_test_password@127.0.0.1:5432/drrosa_test
      PLAYWRIGHT_ALLOW_DATABASE_MUTATION: "1"
      PGSSL: "false"
      PG_POOL_MAX: "1"
      DOCUMENT_STORAGE_DRIVER: local
      UPLOAD_DIR: ../tests/playwright/.uploads
      SCANNER_IMPORT_DIR: ../tests/playwright/.scanner-inbox
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      API_URL: http://localhost:3000
      TRUST_PROXY: loopback
      JWT_SECRET: ci-jwt-secret-dr-rosa-2026-05-25-minimum-32-characters
      STAFF_DEFAULT_PERMISSIONS: patients:read,patients:write,records:read,records:write,calendar:read,calendar:write,documents:read,documents:write,clinical:read,clinical:write,billing:read,billing:write
      LOGIN_RATE_LIMIT_MAX: "1000"
      PUBLIC_BOOKING_FEATURE_ENABLED: "1"
      INITIAL_DIRECTOR_PASSWORD: DirectorCi2026!
      INITIAL_STAFF_PASSWORD: StaffCi2026!
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies (backend)
        working-directory: ./backend
        run: |
          npm ci
      - name: Run npm audit (backend)
        working-directory: ./backend
        run: |
          npm audit --audit-level=moderate
      - name: Run backend tests
        working-directory: ./backend
        run: |
          npm test
      - name: Apply isolated test database migrations and seed data
        working-directory: ./backend
        run: |
          npm run db:migrate:local
          npm run seed:runtime
      - name: Install Playwright dependencies
        working-directory: ./tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: ./tests/playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_USE_PASSWORD_LOGIN: "1"
          PLAYWRIGHT_VERIFY_PASSWORD_LOGIN: "1"
        run: |
          npm test -- --reporter=list
